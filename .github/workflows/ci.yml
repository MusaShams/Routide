name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  public-results-and-python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Public-release privacy and scope preflight
        run: python3 scripts/public_release_preflight.py

      - name: Verify public result bundle
        run: python3 scripts/verify_public_results.py
      - name: Test bounded-memory packer
        working-directory: Research/ExpertPack
        run: python3 -m unittest discover -s tests -v
      - name: Test core route/cache utilities
        env:
          PYTHONPATH: Research/RouterTrace:Research/ExpertPack
        run: |
          python3 -m unittest             Research.RouterTrace.tests.test_schema             Research.RouterTrace.tests.test_simulator             Research.RouterTrace.tests.test_process_memory             Research.RouterTrace.tests.test_state_compare

  swift:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build MLX-backed Routide runtime
        run: swift build --build-system native --target RoutideMLXRuntime

      - name: Run non-Metal runtime tests
        run: swift test --build-system native --filter RoutideRuntimeTests
