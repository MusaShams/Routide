name: Render arXiv PDF

on:
  push:
    branches: ["main"]
    paths:
      - "paper/routide-arxiv.tex"
      - "paper/cache-hit-rates.pdf"
      - "paper/process-footprint.pdf"
      - ".github/workflows/paper.yml"

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            lmodern \
            poppler-utils

      - name: Compile preprint
        working-directory: paper
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error routide-arxiv.tex
          pdflatex -interaction=nonstopmode -halt-on-error routide-arxiv.tex
          pdfinfo routide-arxiv.pdf | grep -E '^(Pages|Page size):'
          pdftotext routide-arxiv.pdf - | grep -F "Routide GitHub repository"

      - name: Commit rendered PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/routide-arxiv.pdf
          if git diff --cached --quiet; then
            echo "Rendered PDF is already current."
          else
            git commit -m "Regenerate arXiv preprint PDF [skip ci]"
            git push
          fi
